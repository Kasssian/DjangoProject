{% extends 'university/base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Изменение оценки</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    
                    <!-- Информационные поля (только для чтения) -->
                    <p><strong>Студент:</strong> {{ progress.student.name }}</p>
                    <p><strong>Предмет:</strong> {{ progress.subject.name }}</p>
                    <p><strong>Семестр:</strong> {{ progress.term }}</p>
                    
                    <hr>
                    
                    <!-- Поле для ввода новой оценки -->
                    <div class="mb-3">
                        <label class="form-label text-danger fw-bold">Оценка / Награда:</label>
                        <input type="text" name="prize" class="form-control" value="{{ progress.prize }}" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success">Сохранить изменения</button>
                    <a href="{% url 'progress-list' %}" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
